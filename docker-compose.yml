# ============================================================
# 竞彩进球数预测 · 飞牛 NAS(fnOS) / 任意 Docker 环境 部署配置
# 用法：见 README「部署到飞牛 NAS」章节
#   · 本文件必须与项目文件夹放在一起（compose 中的 "." 即项目文件夹）
#   · 网页端口默认 8788，可在下面 ports 与 environment.PORT 同步修改
#   · 以 UID 1000（飞牛默认用户）运行，保证 NAS 上文件属主正常；如遇权限问题可删除 user 行
# ============================================================
services:
  jingcai:
    image: node:20-alpine
    container_name: jingcai
    working_dir: /app
    command: ["node", "nas/server.js"]
    user: "1000:1000"
    environment:
      - TZ=Asia/Shanghai
      - PORT=8788
    volumes:
      - .:/app
    ports:
      - "8788:8788"
    restart: unless-stopped
